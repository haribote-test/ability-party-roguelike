<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ability Party Roguelike</title><link rel="stylesheet" href="./src/style.css"></head><body>
<main id="app">
<section id="title" class="screen active"><div class="panel hero"><p class="eyebrow">ABILITY PARTY ROGUELIKE</p><h1>性格から生まれる、<br>自分だけの能力。</h1><p>固定ロールなし。診断で固有能力が決まり、武器と成長選択でビルドを作る4人協力サバイバー。</p><button id="startBtn">性格診断を始める</button></div></section>
<section id="quiz" class="screen"><div class="panel"><div class="topline"><span id="qCount"></span><span id="qType"></span></div><h2 id="question"></h2><div id="answers" class="choices"></div></div></section>
<section id="game" class="screen"><div class="hud"><b id="timer">03:00</b><b>LV <span id="level">1</span></b><b>PT <span id="partyHp">100%</span></b><div class="build"><span id="abilityName"></span><span id="weaponName"></span></div></div><canvas id="gameCanvas" width="1100" height="650"></canvas><div class="help">WASD / 矢印：移動 ｜ 攻撃：自動 ｜ 敵を倒して武器ドロップと強化を狙え</div></section>
<div id="levelup" class="overlay"><div class="panel"><p class="eyebrow">EVOLUTION</p><h2>能力を拡張する</h2><div id="upgradeChoices" class="choices"></div></div></div>
<div id="weaponDrop" class="overlay"><div class="panel drop-panel"><p class="eyebrow">WEAPON DROP</p><h2 id="dropTitle"></h2><p id="dropText"></p><button id="equipBtn">装備する</button><button id="keepBtn" class="secondary">今の武器を維持</button></div></div>
<section id="result" class="screen"><div class="panel"><p class="eyebrow">RESULT</p><h1 id="resultTitle"></h1><div id="resultStats"></div><button id="retryBtn">もう一度遊ぶ</button></div></section>
</main><script type="module" src="./src/main.js"></script></body></html>
